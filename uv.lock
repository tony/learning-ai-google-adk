[[package]]
name = "google-adk-example"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "google-adk" },
    { name = "jinja2" },
    { name = "pydantic" },
    { name = "python-dotenv" },
]

[package.dev-dependencies]
dev = [
    { name = "fastapi" },
    { name = "httpx" },
    { name = "litestar" },
    { name = "mypy" },
    { name = "pydantic" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "ruff" },
    { name = "strawberry-graphql" },
]

